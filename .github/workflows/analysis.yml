name: Production analysis

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyzer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/code-guard/requirements-analysis.txt
      - run: python -m pip install -r skills/code-guard/requirements-analysis.txt
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q skills research tests
      - run: git diff --check

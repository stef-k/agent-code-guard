name: Release

on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
      - MANIFEST.in
      - README.md
      - skills/code-guard/**

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release tag, version, and main ancestry
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is None:
              raise SystemExit(f"Release tag must use numeric vX.Y.Z form: {tag}")

          with open("pyproject.toml", "rb") as pyproject:
              version = tomllib.load(pyproject)["project"]["version"]
          expected_tag = f"v{version}"
          if tag != expected_tag:
              raise SystemExit(f"Release tag {tag} does not match project version {version} ({expected_tag})")
          print(f"Release tag {tag} matches project version {version}")
          PY
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "Release tag commit $tag_commit is not contained in origin/main" >&2
            exit 1
          }
          echo "Release tag commit $tag_commit is contained in origin/main"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions once
        run: |
          python -m build
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl')
          mapfile -t sdists < <(find dist -maxdepth 1 -type f -name '*.tar.gz')
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 || $(find dist -maxdepth 1 -type f | wc -l) -ne 2 ]]; then
            echo "Expected exactly one wheel and one sdist in dist/" >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Record artifact identities
        run: sha256sum dist/*
      - name: Smoke test installed wheel
        run: |
          artifact_dir="$GITHUB_WORKSPACE/dist"
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -m pip install "$artifact_dir"/*.whl
          "$smoke_dir/venv/bin/code-guard" --help
          "$smoke_dir/venv/bin/code-guard" --skill-path
          cat > sample.py <<'PY'
          def answer(value):
              if value:
                  return 42
              return 0
          PY
          "$smoke_dir/venv/bin/code-guard" sample.py --json
      - name: Smoke test installed sdist
        run: |
          artifact_dir="$GITHUB_WORKSPACE/dist"
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -m pip install "$artifact_dir"/*.tar.gz
          "$smoke_dir/venv/bin/code-guard" --help
          "$smoke_dir/venv/bin/code-guard" --skill-path
          cat > sample.py <<'PY'
          def answer(value):
              if value:
                  return 42
              return 0
          PY
          "$smoke_dir/venv/bin/code-guard" sample.py --json
      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

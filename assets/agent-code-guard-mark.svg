<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Agent Code Guard</title>
  <desc id="desc">Two blue guardrails guide a cyan path toward a teal check mark.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#142942"/>
      <stop offset="0.58" stop-color="#102238"/>
      <stop offset="1" stop-color="#0b1828"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8cf0"/>
      <stop offset="1" stop-color="#2b68c5"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27bde9"/>
      <stop offset="1" stop-color="#269ed5"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#44d8c6"/>
      <stop offset="1" stop-color="#35cfc6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.02  0 0 0 0 0.08  0 0 0 0 0.15  0 0 0 .36 0" result="shadow"/>
      <feOffset in="shadow" dy="3" result="offset"/>
      <feMerge><feMergeNode in="offset"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <path d="M130 86 L130 123 L79 161 Q72 167 72 176 L72 336 Q72 346 79 352 L130 390 L130 425 L52 366 Q45 360 45 350 L45 164 Q45 153 54 146 Z" fill="url(#rail)"/>
    <path d="M130 86 L130 123 L79 161 Q72 167 72 176 L72 336 Q72 346 79 352 L130 390 L130 425 L52 366 Q45 360 45 350 L45 164 Q45 153 54 146 Z" fill="url(#rail)" transform="translate(512 0) scale(-1 1)"/>

    <path d="M204 163 L251 193 L334 118 L252 221 Z" fill="url(#check)"/>

    <path d="M250 246 Q256 241 262 246 L278 278 H234 Z" fill="url(#path)"/>
    <path d="M226 295 H286 L306 335 H206 Z" fill="url(#path)"/>
    <path d="M195 359 H317 L350 423 H162 Z" fill="url(#path)"/>
  </g>
</svg>
